global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: labops
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/labops-metrics-token
    static_configs:
      - targets: ['web:8000']
  # This target is intentionally down when the events profile is disabled.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']
  # Consumer-group committed offsets and lag, including disconnected groups.
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: labops-events-workers
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/labops-metrics-token
    static_configs:
      - targets: ['publisher:9100']
        labels: {worker: publisher}
      - targets: ['notification-consumer:9100']
        labels: {worker: notification}
      - targets: ['analytics-consumer:9100']
        labels: {worker: analytics}
      - targets: ['retry-worker:9100']
        labels: {worker: retry}
      - targets: ['dlq-publisher:9100']
        labels: {worker: dlq}
